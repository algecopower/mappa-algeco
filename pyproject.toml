[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = [
    "venv",
    "data",
    "backup",
    "output",
    "deploy",
    "__pycache__",
    ".venv",
    "build",
    "dist",
]

[tool.ruff.lint]
# Subset conservativo: solo errori reali, niente regole cosmetiche
# (whitespace, line-length, ecc. lasciate fuori per non sconvolgere il codice).
select = [
    "F",   # pyflakes — errori reali (undefined names, unused imports, ecc.)
    "E9",  # syntax/runtime errors
    "W6",  # invalid escape sequences
]

[tool.ruff.lint.per-file-ignores]
# moduli/__init__.py contiene re-export intenzionali (API pubblica del package)
"moduli/__init__.py" = ["F401"]

[tool.pytest.ini_options]
testpaths = ["tests"]
