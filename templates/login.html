<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/svg+xml" href="/favicon.svg?v=2">
    <title>Login - Mappa Algeco</title>
    <link rel="stylesheet" href="/static/theme.css">
    <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
    <script src="/static/theme-init.js" defer></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: var(--body-bg);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            color: var(--text-primary);
        }

        .login-container {
            /* Acrylic card pieno per il box login: serve leggibilità del form */
            background: var(--panel-bg-strong);
            backdrop-filter: blur(var(--panel-blur)) saturate(var(--panel-saturate));
            -webkit-backdrop-filter: blur(var(--panel-blur)) saturate(var(--panel-saturate));
            border-radius: var(--radius-xl);
            box-shadow: var(--elev-4);
            padding: 50px 40px;
            width: 100%;
            max-width: 420px;
            animation: slideUp 0.5s var(--easing);
            border: var(--panel-border);
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .logo {
            text-align: center;
            margin-bottom: 30px;
        }

        .logo-icon {
            width: 80px;
            height: 80px;
            background: linear-gradient(135deg, var(--accent-hover) 0%, var(--accent-deep) 100%);
            border-radius: 20px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 15px;
            box-shadow: 0 10px 30px rgba(var(--accent-rgb), 0.35);
        }

        .logo-icon svg {
            width: 45px;
            height: 45px;
            fill: white;
        }

        .logo h1 {
            color: var(--text-primary);
            font-size: 28px;
            font-weight: 700;
            margin-bottom: 5px;
            text-shadow: 0 2px 4px rgba(0, 0, 0, 0.25);
        }

        .logo p {
            color: var(--text-secondary);
            font-size: 14px;
        }

        .form-group {
            margin-bottom: 25px;
            position: relative;
        }

        .form-group label {
            display: block;
            color: var(--text-secondary);
            font-weight: 500;
            margin-bottom: 8px;
            font-size: 14px;
        }

        .input-wrapper {
            position: relative;
        }

        .input-wrapper svg {
            position: absolute;
            left: 15px;
            top: 50%;
            transform: translateY(-50%);
            width: 20px;
            height: 20px;
            fill: var(--text-muted);
            transition: fill var(--duration) var(--easing);
            pointer-events: none;
        }

        .form-group input {
            width: 100%;
            padding: 15px 15px 15px 50px;
            border: 1px solid var(--border);
            border-radius: var(--radius-md);
            font-size: 16px;
            transition:
                border-color var(--duration) var(--easing),
                background-color var(--duration) var(--easing),
                box-shadow var(--duration) var(--easing);
            background: rgba(255, 255, 255, 0.04);
            color: var(--text-primary);
        }

        [data-theme="light"] .form-group input {
            background: rgba(255, 255, 255, 0.6);
        }

        .form-group input::placeholder {
            color: var(--text-muted);
        }

        .form-group input:focus {
            outline: none;
            border-color: var(--accent);
            background: rgba(var(--accent-rgb), 0.06);
            box-shadow: var(--focus-ring);
        }

        .input-wrapper input:focus ~ svg {
            fill: var(--accent);
        }

        /* Bottone login: usa .btn .btn-primary .btn-lg di theme.css.
           Qui solo l'override per occupare l'intera larghezza del form. */
        #btn-login {
            width: 100%;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .error-message {
            background: rgba(239, 68, 68, 0.12);
            color: #ff8585;
            padding: 12px 15px;
            border-radius: var(--radius);
            margin-bottom: 20px;
            font-size: 14px;
            display: none;
            animation: shake 0.5s ease-in-out;
            border-left: 4px solid #ef4444;
        }
        [data-theme="light"] .error-message {
            color: #b91c1c;
            background: rgba(239, 68, 68, 0.08);
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            20%, 60% { transform: translateX(-5px); }
            40%, 80% { transform: translateX(5px); }
        }

        .error-message.show {
            display: block;
        }

        .loading {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid rgba(255,255,255,0.3);
            border-radius: 50%;
            border-top-color: white;
            animation: spin 1s ease-in-out infinite;
            margin-right: 10px;
            vertical-align: middle;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .footer {
            text-align: center;
            margin-top: 30px;
            padding-top: 20px;
            border-top: 1px solid var(--border);
        }

        .footer p {
            color: var(--text-muted);
            font-size: 12px;
        }

        .provincia-badge {
            display: inline-block;
            background: linear-gradient(135deg, var(--accent-hover) 0%, var(--accent-deep) 100%);
            color: white;
            padding: 5px 15px;
            border-radius: var(--radius-full);
            font-size: 12px;
            font-weight: 600;
            margin-top: 10px;
            text-transform: uppercase;
            letter-spacing: 1px;
            box-shadow: 0 4px 14px rgba(var(--accent-rgb), 0.30);
        }

        /* Password visibility toggle */
        .toggle-password {
            position: absolute;
            right: 15px;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            cursor: pointer;
            padding: 5px;
        }

        .toggle-password svg {
            position: static;
            transform: none;
            width: 22px;
            height: 22px;
            fill: var(--text-muted);
            transition: fill var(--duration) var(--easing);
        }

        .toggle-password:hover svg {
            fill: var(--accent);
        }

        /* Rate limiting message */
        .rate-limit-message {
            background: rgba(255, 193, 7, 0.15);
            color: #ffc107;
            padding: 12px 15px;
            border-radius: var(--radius);
            margin-bottom: 20px;
            font-size: 14px;
            display: none;
            border-left: 4px solid #ffc107;
        }
        [data-theme="light"] .rate-limit-message {
            color: #92400e;
            background: rgba(245, 158, 11, 0.10);
            border-left-color: #f59e0b;
        }

        .rate-limit-message.show {
            display: block;
        }

        @media (max-width: 480px) {
            body { padding: 12px; align-items: flex-start; padding-top: 24px; }
            .login-container { padding: 30px 22px; border-radius: 16px; }
            .logo-icon { width: 64px; height: 64px; border-radius: 16px; }
            .logo-icon svg { width: 36px; height: 36px; }
            .logo h1 { font-size: 22px; }
            .form-group { margin-bottom: 18px; }
            .form-group input { padding: 13px 13px 13px 44px; font-size: 16px; }
            .input-wrapper svg { left: 12px; width: 18px; height: 18px; }
            #btn-login { letter-spacing: 0.5px; }
        }

        /* iOS Safari mobile fix: previeni auto-zoom su focus input <16px */
        @media (max-width: 600px) {
            input:not([type="checkbox"]):not([type="radio"]):not([type="range"]):not([type="color"]):not([type="file"]),
            select, textarea { font-size: 16px; }
        }
    </style>
    <script src="/static/csrf.js"></script>
</head>
<body>
    <div class="login-container">
        <div class="logo">
            <div class="logo-icon">
                <svg viewBox="0 0 24 24">
                    <path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7zm0 9.5c-1.38 0-2.5-1.12-2.5-2.5s1.12-2.5 2.5-2.5 2.5 1.12 2.5 2.5-1.12 2.5-2.5 2.5z"/>
                </svg>
            </div>
            <h1>Mappa Algeco</h1>
            <p>Accedi per continuare</p>
            <div class="provincia-badge" id="provincia-badge">Caricamento...</div>
        </div>

        <div class="error-message" id="error-message"></div>
        <div class="rate-limit-message" id="rate-limit-message">
            Troppi tentativi. Riprova tra <span id="countdown">30</span> secondi.
        </div>

        <form id="login-form">
            <div class="form-group">
                <label for="username">Username</label>
                <div class="input-wrapper">
                    <input type="text" id="username" name="username" 
                           autocomplete="username" required 
                           placeholder="Inserisci username">
                    <svg viewBox="0 0 24 24">
                        <path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/>
                    </svg>
                </div>
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <div class="input-wrapper">
                    <input type="password" id="password" name="password" 
                           autocomplete="current-password" required
                           placeholder="Inserisci password">
                    <svg viewBox="0 0 24 24">
                        <path d="M18 8h-1V6c0-2.76-2.24-5-5-5S7 3.24 7 6v2H6c-1.1 0-2 .9-2 2v10c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V10c0-1.1-.9-2-2-2zm-6 9c-1.1 0-2-.9-2-2s.9-2 2-2 2 .9 2 2-.9 2-2 2zm3.1-9H8.9V6c0-1.71 1.39-3.1 3.1-3.1 1.71 0 3.1 1.39 3.1 3.1v2z"/>
                    </svg>
                    <button type="button" class="toggle-password" onclick="togglePassword()">
                        <svg id="eye-icon" viewBox="0 0 24 24">
                            <path d="M12 4.5C7 4.5 2.73 7.61 1 12c1.73 4.39 6 7.5 11 7.5s9.27-3.11 11-7.5c-1.73-4.39-6-7.5-11-7.5zM12 17c-2.76 0-5-2.24-5-5s2.24-5 5-5 5 2.24 5 5-2.24 5-5 5zm0-8c-1.66 0-3 1.34-3 3s1.34 3 3 3 3-1.34 3-3-1.34-3-3-3z"/>
                        </svg>
                    </button>
                </div>
            </div>

            <button type="submit" class="btn btn-primary btn-lg" id="btn-login">
                Accedi
            </button>
        </form>

        <div class="footer">
            <p>&copy; <span id="current-year"></span> Mappa Algeco</p>
        </div>
    </div>

    <script>
        // Rate limiting
        let failedAttempts = 0;
        let lockoutUntil = 0;
        const MAX_ATTEMPTS = 5;
        const LOCKOUT_SECONDS = 30;

        // Carica provincia
        async function loadProvincia() {
            try {
                const response = await fetch('/api/config');
                const data = await response.json();
                document.getElementById('provincia-badge').textContent = data.provincia || 'N/A';
            } catch (e) {
                document.getElementById('provincia-badge').textContent = 'Offline';
            }
        }

        // Toggle password visibility
        function togglePassword() {
            const passwordInput = document.getElementById('password');
            const eyeIcon = document.getElementById('eye-icon');
            
            if (passwordInput.type === 'password') {
                passwordInput.type = 'text';
                eyeIcon.innerHTML = '<path d="M12 7c2.76 0 5 2.24 5 5 0 .65-.13 1.26-.36 1.83l2.92 2.92c1.51-1.26 2.7-2.89 3.43-4.75-1.73-4.39-6-7.5-11-7.5-1.4 0-2.74.25-3.98.7l2.16 2.16C10.74 7.13 11.35 7 12 7zM2 4.27l2.28 2.28.46.46C3.08 8.3 1.78 10.02 1 12c1.73 4.39 6 7.5 11 7.5 1.55 0 3.03-.3 4.38-.84l.42.42L19.73 22 21 20.73 3.27 3 2 4.27zM7.53 9.8l1.55 1.55c-.05.21-.08.43-.08.65 0 1.66 1.34 3 3 3 .22 0 .44-.03.65-.08l1.55 1.55c-.67.33-1.41.53-2.2.53-2.76 0-5-2.24-5-5 0-.79.2-1.53.53-2.2zm4.31-.78l3.15 3.15.02-.16c0-1.66-1.34-3-3-3l-.17.01z"/>';
            } else {
                passwordInput.type = 'password';
                eyeIcon.innerHTML = '<path d="M12 4.5C7 4.5 2.73 7.61 1 12c1.73 4.39 6 7.5 11 7.5s9.27-3.11 11-7.5c-1.73-4.39-6-7.5-11-7.5zM12 17c-2.76 0-5-2.24-5-5s2.24-5 5-5 5 2.24 5 5-2.24 5-5 5zm0-8c-1.66 0-3 1.34-3 3s1.34 3 3 3 3-1.34 3-3-1.34-3-3-3z"/>';
            }
        }

        // Check lockout
        function isLockedOut() {
            if (lockoutUntil > Date.now()) {
                return true;
            }
            return false;
        }

        // Start countdown
        function startCountdown() {
            const countdownEl = document.getElementById('countdown');
            const rateLimitMsg = document.getElementById('rate-limit-message');
            
            rateLimitMsg.classList.add('show');
            
            const interval = setInterval(() => {
                const remaining = Math.ceil((lockoutUntil - Date.now()) / 1000);
                if (remaining <= 0) {
                    clearInterval(interval);
                    rateLimitMsg.classList.remove('show');
                    failedAttempts = 0;
                    return;
                }
                countdownEl.textContent = remaining;
            }, 1000);
        }

        // Show error
        function showError(message) {
            const errorEl = document.getElementById('error-message');
            errorEl.textContent = message;
            errorEl.classList.add('show');
        }

        // Hide error
        function hideError() {
            document.getElementById('error-message').classList.remove('show');
        }

        // Handle form submit
        document.getElementById('login-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            hideError();

            if (isLockedOut()) {
                return;
            }

            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value;
            const btn = document.getElementById('btn-login');

            if (!username || !password) {
                showError('Inserisci username e password');
                return;
            }

            // Disable button and show loading
            btn.disabled = true;
            btn.innerHTML = '<span class="loading"></span> Accesso...';

            try {
                const response = await fetch('/api/login', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ username, password }),
                });

                const data = await response.json();

                if (response.ok && data.success) {
                    // Login successful - redirect
                    window.location.href = '/';
                } else {
                    // Login failed
                    failedAttempts++;
                    
                    if (failedAttempts >= MAX_ATTEMPTS) {
                        lockoutUntil = Date.now() + (LOCKOUT_SECONDS * 1000);
                        startCountdown();
                    }
                    
                    showError(data.message || 'Credenziali non valide');
                }
            } catch (error) {
                showError('Errore di connessione. Riprova.');
            } finally {
                btn.disabled = false;
                btn.innerHTML = 'Accedi';
            }
        });

        // Focus username on load
        window.addEventListener('load', () => {
            loadProvincia();
            document.getElementById('username').focus();
            document.getElementById('current-year').textContent = new Date().getFullYear();
        });

        // Enter key handling
        document.getElementById('password').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                document.getElementById('login-form').dispatchEvent(new Event('submit'));
            }
        });
    </script>
</body>
</html>
